[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/derekross/peridot"

[workspace.dependencies]
# Shared building blocks from Opal, pinned to a commit.
opal-core = { git = "https://github.com/derekross/opal", rev = "46dbf67" }
opal-kit = { git = "https://github.com/derekross/opal", rev = "46dbf67" }
nostr-sdk = "0.45"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

# Recovery kits use scrypt; unoptimized it takes a minute in tests.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

# TEMPORARY until Opal 93483dd (local apps pairing) is pushed: build against
# the local checkout. Then set both revs above to 93483dd, remove this
# section and run `cargo update -p opal-core -p opal-kit`.
[patch."https://github.com/derekross/opal"]
opal-core = { path = "../opal/crates/opal-core" }
opal-kit = { path = "../opal/crates/opal-kit" }
