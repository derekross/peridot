[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/derekross/peridot"

[workspace.dependencies]
# Shared building blocks from Opal, pinned to a commit.
opal-core = { git = "https://github.com/derekross/opal", rev = "93483dd" }
opal-kit = { git = "https://github.com/derekross/opal", rev = "93483dd" }
nostr-sdk = "0.45"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

# Recovery kits use scrypt; unoptimized it takes a minute in tests.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
