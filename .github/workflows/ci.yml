# Tests and lints on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No agent scaffolding or transcripts in the tree
        # AGENTS.md, CLAUDE.md, .claude/, .cursor/, .aider* and *.jsonl
        # transcripts are local working files; a release must not carry them.
        run: |
          bad="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(AGENTS\.md|CLAUDE\.md|\.aider[^/]*)$|(^|/)(\.claude|\.cursor)/|\.jsonl$' || true)"
          if [[ -n $bad ]]; then printf 'tracked files that must not be:\n%s\n' "$bad"; exit 1; fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --tests -- -D warnings
      - run: cargo test --locked --workspace
      - run: ./dist/gen-known-hashes.sh --check
      - run: tests/install/run.sh
